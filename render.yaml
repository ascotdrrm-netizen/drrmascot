# Render Blueprint: one free web service built from the Dockerfile.
# Values marked sync: false are entered in the Render dashboard, never here.
# See docs/RENDER_SUPABASE.md.
services:
  - type: web
    name: drrmascot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    # Deploy a push only after GitHub CI passes on it.
    autoDeployTrigger: checksPass
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: ASCOT DRRMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: BEHIND_TLS_PROXY
        value: "true"
      # Render sits behind Cloudflare, which sets the visitor's real IP here.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: RUN_MIGRATIONS
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      # The container disk is wiped on every deploy and wake, so records,
      # photos and backups live in the private Supabase bucket.
      - key: FILES_DISK
        value: s3
      - key: BACKUP_DISK
        value: s3
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: ap-northeast-2
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: drrms

      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SESSION_LIFETIME
        value: "120"
      # Closing the browser signs you out unless "Keep me signed in" was ticked.
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: "120"

      # Brevo over HTTPS: Reporter email verification, password reset and
      # broadcast emails depend on it. Render's free plan blocks outbound SMTP
      # (ports 25/465/587), so Gmail SMTP can't be used here. BREVO_API_KEY and
      # MAIL_FROM_ADDRESS (a sender verified in Brevo) are entered in the dashboard.
      - key: MAIL_MAILER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: ASCOT DRRMS
      # SOS text alerts. Set SMS_GATEWAY to "semaphore" in the dashboard once
      # SEMAPHORE_API_KEY (a funded account) is in; "log" only writes the log.
      # SEMAPHORE_SENDER_NAME is optional until Semaphore approves the name.
      - key: SMS_GATEWAY
        sync: false
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        sync: false
      # Backup / Restore / Clear records stay disabled until this is set:
      # a bcrypt hash of the data-privacy password (docs/RENDER_SUPABASE.md).
      - key: DATA_PRIVACY_PASSWORD_HASH
        sync: false
