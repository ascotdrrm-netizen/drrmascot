<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Static files skip PHP. Built assets carry a content hash in their
    # name, so a browser may keep them a year; libraries, icons and seals
    # change rarely: a week. (Pages and record files stay private, no-store.)
    <LocationMatch "^/build/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/(vendor|icons|images)/">
        Header set Cache-Control "public, max-age=604800"
    </LocationMatch>

    # Restore takes a backup file from the PC. One with the record photos
    # (Clear All Records' copy) can pass the 12M every other form keeps
    # (docker/php.ini), so only this address takes more.
    <IfModule php_module>
        <Location "/admin/backup/restore">
            php_value upload_max_filesize 256M
            php_value post_max_size 260M
        </Location>
    </IfModule>

    # Request logs are noise on Render; Laravel logs to stderr.
    ErrorLog /dev/stderr
    CustomLog /dev/null common
</VirtualHost>
