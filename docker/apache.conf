<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Request logs are noise on Render; Laravel logs to stderr.
    ErrorLog /dev/stderr
    CustomLog /dev/null common
</VirtualHost>
